  # Organization-assigned reference IDs (employee/customer/policy/claim/application/record
  # numbers). Named unique_identifier, not account_number: these are identifiers, not
  # financial accounts. A bank account (fin::bank_account_number) is a different concept
  # that happens to share a digit shape — no is_a between them, exactly as phone_number
  # and a bare number are not the same thing.
  account_reference_number:
    description: "Org-assigned account reference, e.g. ACC-700000"
    regex_patterns:
      accepted_patterns:
        # Split out of unique_identifier: an account reference is HIPAA Safe Harbor
        # identifier #10, while the generic bucket also holds employee/student/record IDs
        # that are not account numbers, so one shared entity could not report either honestly.
        - |-
          \bACC[-]\w{1,15}\b
      prohibited_patterns: []
      confidence_weight: 0.75
    validators:
      enum: null
      confidence_weight: null
    contextual_phrases:
      values:
        - account
        - account number
        - account id
        - account ref
        - account reference
        - billing account
      confidence_weight: null
    prohibited_prefix:
      values: []
      confidence_weight: null
    prohibited_suffix:
      values: []
      confidence_weight: null
    classification:
        category: PII
        data_class: direct_identifier
    de_identifier: ACCOUNT_NUMBER
    default_action: DEFAULT

  unique_identifier:
    description: "Org-assigned ID for a person/account, e.g. EMP-789"
    regex_patterns:
      accepted_patterns:
        # Prefixed customer/record/policy IDs: CUST-001234, RES-456789012.
        # ACC- is deliberately absent: it has its own entity so the HIPAA checklist can
        # report it under 'account number' rather than the catch-all 'other unique id'.
        - |-
          \b(?:CUST|RES|POL|CLM|MEM|SUB)[-]\w{1,15}\b
        # Any short uppercase prefix over digit groups: EMP-789456123, LO-789456,
        # CLM-2024-789456123. Held below the confidence floor because the shape alone is
        # just as often an asset tag ("ASSET-789456123") or a report number
        # ("CR-789456123"), so a nearby ID label has to corroborate it.
        - pattern: |-
            \b[A-Z]{2,6}-\d{3,}(?:-\d{2,})*\b
          confidence_weight: 0.25
      prohibited_patterns: []
      confidence_weight: 0.75
    validators:
      enum: null
      confidence_weight: null
    contextual_phrases:
      values:
        - account
        - account number
        - account id
        - customer id
        - member id
        - policy number
        - reference number
        - customer number
