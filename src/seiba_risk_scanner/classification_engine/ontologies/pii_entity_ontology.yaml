        - manager id
        - student id
        - adjuster id
        - officer id
        - application id
        - application number
        - claim number
        - subscriber id
        - record id
        - record number
      confidence_weight: null
    prohibited_prefix:
      values: []
      confidence_weight: null
    prohibited_suffix:
