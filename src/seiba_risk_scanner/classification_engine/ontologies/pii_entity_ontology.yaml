# certificate_license_number lives only in the PHI ontology now. Keeping a PII copy split
# the same concept across two categories, so the same license could score as either
# depending on which fired. Detection is unchanged: it is pattern-less and judged by NER +
# proximity (see phi_entity_ontology::certificate_license_number).
