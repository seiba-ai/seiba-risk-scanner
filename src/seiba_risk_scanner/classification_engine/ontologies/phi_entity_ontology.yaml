  physician_names:
    description: "A physician's or provider's name"
    # A physician is a person. The clinical context below still does the detecting, but the
    # span is reported as person_names: whether a name belongs to the treating doctor or to
    # a patient who happens to hold a doctorate is a judgement call, and getting it wrong
    # must not decide whether the name is treated as a name at all.
    is_a: pii_entity_ontology::person_names
    regex_patterns:
      accepted_patterns: []
      prohibited_patterns:
        # Block credential abbreviations that NER may pick up as names: "LCSW", "LMFT", etc.
        - |-
          \b(?:LCSW|LMFT|LMSW|MSW|LPC|APRN|CRNA|CNM|CNA|EMT|NP|PA-C)\b
      confidence_weight: null
    validators:
      enum: null
      confidence_weight: null
    contextual_phrases:
      values:
