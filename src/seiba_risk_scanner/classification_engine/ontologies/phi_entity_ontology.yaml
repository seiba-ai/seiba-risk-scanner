        - systolic
        - diastolic
        - mmhg
        - heart rate
        - pulse
        - temperature
        - temp
        - oxygen saturation
        - spo2
        - o2 sat
        - respiratory rate
        - rr
        - vital signs
        - vitals
      confidence_weight: null
    prohibited_prefix:
      # Prevents BP pattern \d{2,3}/\d{2,3} from matching card expiry dates like "expires 06/26"
      values:
