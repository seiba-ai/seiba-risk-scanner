  medication_dosage:
    description: "Medication name and/or dosage"
    regex_patterns:
      accepted_patterns:
        # Standard dose: 500mg, 10mcg, 2.5ml, 1g, 250IU
        - |-
          \b\d+(?:\.\d+)?\s*(?:mg|mcg|ml|mL|g|kg|μg|IU|units?|tablet|tablets?|cap|caps|capsule|capsules?)\b
        # Weight-based: 5mg/kg, 10mcg/day, 2ml/hr
        - |-
          \b\d+(?:\.\d+)?\s*(?:mg|mcg|ml|mL|g|μg)\s*/\s*(?:kg|day|hr|hour|dose|min|kg/day)\b
        # Frequency-dosed: 2x daily, twice daily, 3 times/day
        - |-
          (?i)\b(?:\d+\s*(?:x|times?)\s+(?:daily|per\s+day|a\s+day)|(?:once|twice|thrice)\s+(?:daily|a\s+day|per\s+day))\b
      prohibited_patterns: []
      confidence_weight: 0.70
    validators:
