  vital_signs:
    description: "Vital sign measurement (BP, HR, temp)"
    regex_patterns:
      accepted_patterns:
        # Blood pressure: 140/90, 120/80 — prohibited_suffix "/" blocks MM/DD/YYYY date overlap
        - |-
          \b\d{2,3}\/\d{2,3}\b
        # Heart rate / pulse: 72 bpm, 110bpm
        - |-
          \b\d{2,3}\s*bpm\b
        # Temperature: 98.6°F, 37.2°C, 38.5 C
        - |-
          \b\d{2,3}(?:\.\d)?\s*°?\s*[CF]\b
        # SpO2 / oxygen saturation: 98%, 95%
        - |-
          \b(?:9[0-9]|100)\s*%\s*(?:O2|SpO2|sat|oxygen)?\b
        # Respiratory rate: 16 breaths/min, 20 br/min
        - |-
          \b\d{1,2}\s*(?:breaths?|br)[\s/](?:min|minute)\b
      prohibited_patterns: []
      confidence_weight: 0.65
    validators:
      enum: null
      confidence_weight: null
    contextual_phrases:
