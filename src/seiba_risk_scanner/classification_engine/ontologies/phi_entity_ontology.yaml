  genomic_variants:
    description: "Genomic variant notation (rsID, mutation)"
    regex_patterns:
      accepted_patterns:
        # Named genes: BRCA1, BRCA2, APOE, MTHFR, TP53, EGFR, KRAS, BRAF, etc.
        - |-
          \b(?:BRCA[12]|APOE|MTHFR|TP53|EGFR|KRAS|BRAF|MLH1|MSH[26]|APC|PTEN|ATM|CHEK2|PALB2|RAD51[CD]?|STK11|CDH1|NBN|NF[12]|VHL|RET|MEN1|MUTYH|SMAD4|BMPR1A|EPCAM)\b
        # HGVS coding/genomic notation: c.1234A>G, g.456789T>C
        - |-
          \b[cgnmr]\.\d+(?:[+-]\d+)?[ACGT]?>[ACGT]\b
        # HGVS protein notation: p.Arg248Trp, p.Lys711*, p.Val600Glu
        - |-
          \bp\.[A-Z][a-z]{2}\d+(?:[A-Z][a-z]{2}|[*?])\b
        # Variant IDs with allele notation: C677T, rs numbers
        - |-
          \b(?:[A-Z]\d+[A-Z]|rs\d{5,})\b
        # Allele pair notation: E3/E4, E2/E3, A1/A2
        - |-
          \b[A-Z][0-9]+\/[A-Z][0-9]+\b
      prohibited_patterns: []
      confidence_weight: 0.75
    validators:
