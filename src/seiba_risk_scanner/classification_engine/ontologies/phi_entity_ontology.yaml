        - dr.
        - doctor
        - rn
        - md
        - m.d.
        - d.o.
        - nurse
        - physician
        - provider
        - attending
        - referring physician
        - prescriber
        - np
        - pa
        - nurse practitioner
        - physician assistant
        - surgeon
        - specialist
      # High weight so NER PERSON spans near clinical titles get promoted to physician_names via rescue.
      confidence_weight: 0.80
    prohibited_prefix:
      values: []
      confidence_weight: null
    prohibited_suffix:
      values: []
      confidence_weight: null
    classification:
