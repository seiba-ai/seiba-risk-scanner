  # Birth and death dates are stronger identifiers than an arbitrary date (a DOB is one
  # of the HIPAA Safe Harbor 18; a visit date is not), so they are their own High-severity
  # entities rather than being folded into dates. Pattern-less: the same digits are just a
  # date until proximity ("DOB", "deceased") says otherwise, so they are judged by context
  # and by NER (OpenMed emits a distinct date_of_birth label). High ner weight so the
  # specific label wins over a generic deterministic dates hit at the same span.
  date_of_birth:
    description: "Date of birth"
    regex_patterns:
      # Pattern-less on purpose: patterns would collide with dates in the deterministic
      # slot. The validator below gates the context override to spans that really are
      # dates, so a name sitting next to "DOB" is not misgrabbed.
      accepted_patterns: []
      prohibited_patterns: []
      confidence_weight: null
    validators:
      enum: VALIDATE_DATE
      confidence_weight: null
    contextual_phrases:
      values:
        - date of birth
        - dob
        - born
        - born on
        - born in
        - birth date
        - birthday
      confidence_weight: 0.8
      # A date carrying birth context is reclaimed from generic dates even when the dates
      # hit is confident — the same override uk_nhs_number uses to beat phone/fax.
      rescue_override: true
    prohibited_prefix:
      values: []
      confidence_weight: null
    prohibited_suffix:
      values: []
      confidence_weight: null
    classification:
        category: PHI
        data_class: direct_identifier
        ner_confidence_weight: 0.9
    de_identifier: DATE_OF_BIRTH
    default_action: DEFAULT

  date_of_death:
    description: "Date of death"
