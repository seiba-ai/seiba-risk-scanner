# PHI (Protected Health Information) Entity Ontology
# This file defines rules, validators, and classification for PHI entities

# default_action — what to DO with each entity when a policy is applied.
#   DEFAULT            use whatever the chosen policy profile decides (hipaa_safe_harbor, ...)
#   keep               leave the value untouched
#   mask / redact      blank it out            -> [ENTITY]
#   hash               stable token, still joinable
#   replace            realistic fake value
#   format_preserve    fake value keeping the original shape
#   generalize[:level] coarsen instead of destroy. Only for dates, ages, zip codes and
#                      coordinates. Levels: date month|year|decade, age 5_year_band|
#                      10_year_band|20_year_band, zip 3_digit|1_digit, coords 1_decimal|integer
# Edit these freely — this file is the config.

entities:
  medical_record_number_mrn:
    description: "Medical Record Number (MRN)"
    regex_patterns:
      accepted_patterns:
        # Bare patient ID digits — near-zero base, context-gated so only MRN-labelled spans win.
        - |-
          \b\d{5,10}\b
        # Prefixed MRN formats: "MRN: 789456", "MRN-456", "PAT-12345", "BH-MRN-789"
        # Lookahead (?=[\w-]*\d) ensures the suffix contains at least one digit — blocks
        # prefix-only spans like "MRN: BH-MRN-" that have no trailing numeric ID.
        - |-
          \b(?:MRN|PAT|BH-MRN|PTID)[-:\s]\s*(?=[\w-]*\d)[\w-]{4,12}\b
        # Research / genomic study subject IDs: "GEN-SUBJ-001", "SUBJ-042", "RES-001"
        - |-
          \b(?:GEN|SUBJ|RES|SUB)[-:\s]\s*(?=[\w-]*\d)[\w-]{1,12}\b
      prohibited_patterns: []
      # Near-zero base; requires strong MRN-specific context to clear min_fused_confidence.
      confidence_weight: 0.05
    validators:
      enum: null
      confidence_weight: null
    contextual_phrases:
      values:
        - mrn
        - medical record number
        - medical record
        - patient id
        - patient identifier
        - record number
        - patient number
        - chart number
        - case number
        - patient
        - admission
        - discharge
        - encounter
        - visit
        - chart
        - subject
        - subject id
        - research subject
        - study subject
        - participant
        - participant id
        - study id
        - cohort
      confidence_weight: 0.85
    prohibited_prefix:
      values:
        - ssn
        - ssn:
        - social security
      # Avoid tagging SSN-style labels as MRN.
      confidence_weight: null
    prohibited_suffix:
      values: []
      confidence_weight: null
    classification:
        category: PHI
        data_class: direct_identifier
    de_identifier: ID_NUM
    default_action: DEFAULT

  health_plan_beneficiary_number:
    description: "Health plan beneficiary number"
    regex_patterns:
      accepted_patterns:
        # Prefixed insurance identifiers: INS-456789012, GRP-789, MEM-12345, BEN-XY123
        - |-
          \b(?:INS|GRP|MEM|PLN|BEN|HPB)[-]\w{1,15}\b
        # Major insurer member/policy IDs: UHC-987654321, BCBS-12345, AET-XY789, HUM-001234
        - |-
          \b(?:UHC|BCBS|BCB|AET|HUM|CIG|ANT|KSR|MOL|CVH|WLP|SHP)[-]\w{1,15}\b
      prohibited_patterns: []
      confidence_weight: 0.70
    validators:
      enum: null
      confidence_weight: null
    contextual_phrases:
      values:
        - health plan
        - beneficiary
        - insurance
        - policy
        - member id
        - health plan beneficiary
        - beneficiary id
        - beneficiary number
        - hpb id
        - hpb number
        - medicare beneficiary
        - beneficiary identifier
        - plan beneficiary
        - medicare
        - medicaid
        - hpb
        - unitedhealthcare
        - uhc
        - bluecross
        - blueshield
        - aetna
        - humana
        - cigna
        - anthem
        - kaiser
        - molina
        - coverage
        - plan number
        - policy number
      confidence_weight: null
    prohibited_prefix:
      values: []
      confidence_weight: null
    prohibited_suffix:
      values: []
      confidence_weight: null
    classification:
        category: PHI
        data_class: direct_identifier
    de_identifier: ID_NUM
    default_action: DEFAULT

