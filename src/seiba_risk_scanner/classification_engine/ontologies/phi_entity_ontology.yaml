  relative_date_expressions:
    description: "Relative date phrase, e.g. 'last Tuesday'"
    regex_patterns:
      accepted_patterns:
        # Standalone today / yesterday / tomorrow
        - |-
          (?i)\btoday\b
        - |-
          (?i)\b(?:yesterday|tomorrow)\b
        # last/next/this + concrete time unit
        - |-
          (?i)\b(?:last|next|this|past)\s+(?:week|month|year|quarter|weekend|morning|afternoon|evening|few\s+weeks?|few\s+months?|few\s+days?)\b
        # N units ago or from now
        - |-
          (?i)\b\d+\s+(?:days?|weeks?|months?|years?)\s+(?:ago|from\s+now|earlier|later)\b
        # Clinical multi-word anchors: "from the lab today", "from the clinic today"
        - |-
          (?i)\bfrom\s+(?:the\s+)?\w+\s+today\b
      prohibited_patterns: []
      # Low base weight — only fires confidently when clinical context phrases are present
      confidence_weight: 0.15
    validators:
      enum: null
      confidence_weight: null
    contextual_phrases:
      # High weight so standalone "today/yesterday" only score high in clinical contexts
      values:
        - patient
        - session
        - treatment
        - appointment
        - symptom
        - onset
        - diagnosis
        - discharge
        - follow-up
        - followup
        - therapy
        - clinical
        - clinic
        - presents
        - visit
        - came in
        - lab
        - results
        - research
        - study
        - participant
        - sequencing
        - specimen
      confidence_weight: 0.80
    prohibited_prefix:
      values: []
      confidence_weight: null
    prohibited_suffix:
      values: []
      confidence_weight: null
    classification:
        category: PHI
        data_class: neutral
    de_identifier: null
    default_action: DEFAULT

